name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Download Android platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "."

      # aapt2 决定「应用名」和「② 启动应用」是否可用；发布包必须自带，
      # 否则没装 Android SDK 的用户拿到后启动按钮永远是灰的（aapt2.exe 单文件即可运行）
      - name: Download aapt2 (build-tools)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/build-tools_r34-windows.zip" -OutFile "build-tools.zip"
          Expand-Archive -Path "build-tools.zip" -DestinationPath "bt"
          $aapt2 = Get-ChildItem -Path "bt" -Recurse -Filter "aapt2.exe" | Select-Object -First 1
          if (-not $aapt2) { throw "aapt2.exe not found in build-tools archive" }
          New-Item -ItemType Directory -Force -Path "aapt2" | Out-Null
          Copy-Item $aapt2.FullName "aapt2\aapt2.exe"
          & "aapt2\aapt2.exe" version

      - name: Smoke test
        run: python lynk_adb_tool.py --selftest

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean LynkAdbTool.spec

      - name: Assemble release
        shell: pwsh
        run: |
          $out = "dist\LynkAdbTool"
          New-Item -ItemType Directory -Force -Path "$out\tools\adb" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out\tools\aapt2" | Out-Null
          Copy-Item "platform-tools\adb.exe" "$out\tools\adb\"
          Copy-Item "platform-tools\AdbWinApi.dll" "$out\tools\adb\"
          Copy-Item "platform-tools\AdbWinUsbApi.dll" "$out\tools\adb\"
          Copy-Item "aapt2\aapt2.exe" "$out\tools\aapt2\"
          Copy-Item "README.md" "$out\"
          Copy-Item "LICENSE" "$out\"
          if (Test-Path "assets") { Copy-Item -Recurse "assets" "$out\" }
          Compress-Archive -Path "$out\*" -DestinationPath "LynkAdbTool-win64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LynkAdbTool-win64
          path: LynkAdbTool-win64.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LynkAdbTool-win64.zip
          generate_release_notes: true
